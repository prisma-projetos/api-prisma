services:
  db:
    image: postgres:15-alpine
    container_name: prisma-postgres
    restart: always
    environment:
      - POSTGRES_DB=prisma
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres-prisma
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
