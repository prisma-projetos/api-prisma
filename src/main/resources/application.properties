spring.application.name=api-prisma
server.port=8080
# Profile padrao. A env SPRING_PROFILES_ACTIVE tem precedencia sobre o
# application.properties, entao o deploy sobrescreve isto sem precisar de
# placeholder aqui. Nao usar API_SECURITY_KEY para isto: ela e a chave da
# API, nao o nome do profile -- reusa-la deixava os dois impossiveis de
# satisfazer ao mesmo tempo.
spring.profiles.active=local

# Respostas de erro nao carregam detalhe interno. Vale para todos os profiles:
# o DevTools, quando presente, liga o stack trace por conta propria, e ele
# expoe pacotes, versoes de framework e caminhos de arquivo do servidor.
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-message=never
server.error.include-binding-errors=never

# Nao anunciar o servidor de aplicacao nas respostas.
server.server-header=

# Corpo de requisicao pequeno: a API so recebe filtros, nunca conteudo.
spring.servlet.multipart.enabled=false

# Bug conhecido do springdoc ao reprocessar o schema "type" do OpenAPI 3.1:
# gera WARN de deserializacao inofensivo toda vez que o Swagger UI ou
# /v3/api-docs e acessado. Nao afeta a API, so suja o log.
logging.level.org.springdoc=ERROR
